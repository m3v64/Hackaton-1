services:
  web:
    container_name: web
    restart: unless-stopped
    build: ./frontend
    ports:
      - ${FRONTEND_PORT}:80
      
  api:
    build: ./api
    container_name: api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:8000"
